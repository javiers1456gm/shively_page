<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Logos vectorizados</title><style>body{font-family:Arial,sans-serif;background:#f5f5f5;padding:40px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}.card{background:white;border-radius:18px;padding:24px;box-shadow:0 10px 30px #0001}.logo{height:160px;display:flex;align-items:center;justify-content:center;border:1px dashed #ddd;border-radius:14px}.logo img{max-width:90%;max-height:120px}code{background:#eee;padding:3px 6px;border-radius:6px}</style></head><body><h1>Logos vectorizados</h1><p>Archivos SVG generados automáticamente a partir de tus imágenes.</p><div class="grid"><div class="card"><h2>gm logo.png</h2><div class="logo"><img src="gm_logo.svg"></div><p>Archivo: <code>gm_logo.svg</code></p><p>Paths: 3</p></div><div class="card"><h2>mabe logo.png</h2><div class="logo"><img src="mabe_logo.svg"></div><p>Archivo: <code>mabe_logo.svg</code></p><p>Paths: 2</p></div><div class="card"><h2>nicdec logo.webp</h2><div class="logo"><img src="nicdec_logo.svg"></div><p>Archivo: <code>nicdec_logo.svg</code></p><p>Paths: 5</p></div><div class="card"><h2>stellantis logo.jpg</h2><div class="logo"><img src="stellantis_logo.svg"></div><p>Archivo: <code>stellantis_logo.svg</code></p><p>Paths: 2</p></div></div></body></html>
