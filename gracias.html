<!DOCTYPE html>
<html lang="es-MX">

<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P74KRQZ9SY"></script>
    <script>
        window.dataLayer = window.dataLayer || [];

        gtag('config', 'G-P74KRQZ9SY');

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gracias por contactarnos | Shively Bros México</title>
    <meta name="description" content="Gracias por comunicarte con Shively Bros México. En breve te contactaremos." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/images/logo-shively-fondo-blanco.png">
    <style>
        :root {
            --sb-green: #007f24;
            --sb-green-dark: #005f1b;
            --sb-black: #111827;
            --sb-gray: #5f6b76;
            --sb-soft: #f5f7f4;
            --sb-white: #fff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: 'Poppins', sans-serif;
            background: var(--sb-soft);
            color: var(--sb-black);
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #0d1f15 0%, #0f2d1d 30%, #0d5f2f 70%, #137d39 100%);
            animation: backgroundShift 8s ease-in-out infinite alternate;
        }

        @keyframes backgroundShift {
            0% {
                background: linear-gradient(100deg, #0d1f15 0%, #0f2d1d 30%, #0d5f2f 70%, #137d39 100%);
            }

            50% {
                background: linear-gradient(100deg, #0d2a1e 0%, #124d2a 30%, #168c42 70%, #4fdb83 100%);
            }

            100% {
                background: linear-gradient(100deg, #122f24 0%, #0d5f2f 30%, #179346 70%, #1ab95b 100%);
            }
        }

        .thank-you-wrap {
            width: min(92vw, 860px);
            padding: 28px;
        }

        .thank-you-card {
            background: rgba(255, 255, 255, 0.96);
            border-radius: 28px;
            padding: clamp(28px, 4vw, 52px);
            box-shadow: 0 26px 80px rgba(17, 24, 39, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        .thank-you-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1ec85b, var(--sb-green));
            color: #fff;
            font-size: 2.6rem;
            box-shadow: 0 18px 40px rgba(0, 127, 36, 0.26);
            margin-bottom: 20px;
        }

        .thank-you-logo {
            display: block;
            width: min(100%, 250px);
            height: auto;
            margin: 0 auto 28px;
        }

        .thank-you-card h1 {
            margin: 0 0 14px;
            font-size: clamp(2.1rem, 4vw, 3.3rem);
            line-height: 1.08;
            font-weight: 800;
            color: var(--sb-black);
        }

        .thank-you-card p {
            margin: 0 auto 18px;
            max-width: 620px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: var(--sb-gray);
        }

        .thank-you-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-top: 26px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 0;
            text-decoration: none;
            border-radius: 999px;
            padding: 14px 26px;
            font-weight: 700;
            font-size: 1rem;
            transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
            cursor: pointer;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--sb-green), var(--sb-green-dark));
            color: #fff;
            box-shadow: 0 16px 32px rgba(0, 127, 36, 0.26);
        }

        .btn-secondary {
            background: #0a66c2;
            color: #fff;
            box-shadow: 0 16px 32px rgba(10, 102, 194, 0.22);
        }

        .linkedin-note {
            margin-top: 18px;
            color: var(--sb-gray);
            font-size: 0.85rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            font-weight: 700;
        }

        @media (max-width: 576px) {
            .thank-you-wrap {
                width: min(94vw, 480px);
                padding: 16px;
            }

            .thank-you-card {
                border-radius: 22px;
                padding: 26px 18px;
            }

            .thank-you-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="thank-you-wrap">
        <div class="thank-you-card">
            <img class="thank-you-logo" src="assets/images/SHIVELYBROSLOGO_horiz.png" alt="Shively Bros México">
            <div class="thank-you-badge"><i class="bi bi-check-lg"></i></div>
            <h1>¡Gracias por contactarnos!</h1>
            <p>Tu solicitud fue recibida correctamente. Nuestro equipo de Shively Bros México revisará tus datos y te
                responderá a la brevedad para ayudarte con la mejor solución para tu operación.</p>

            <div class="thank-you-actions">
                <a class="btn btn-primary" href="index.html"><i class="bi bi-arrow-left"></i> Regresar a la página
                    principal</a>
                <a class="btn btn-secondary"
                    href="https://www.linkedin.com/company/shivelybrosmexico/posts/?feedView=all" target="_blank"
                    rel="noopener" aria-label="Ir a LinkedIn">
                    <i class="bi bi-linkedin"></i> LinkedIn
                </a>
            </div>

            <div class="linkedin-note">Síguenos en LinkedIn</div>
        </div>
    </main>
</body>

</html>
